<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#16222d,#070b0f 70%);color:#e4e9ec;font-family:Arial,Helvetica,sans-serif;position:relative}
.top{position:absolute;left:0;right:0;top:44px;text-align:center}
.brand{font:700 15px Arial;letter-spacing:.22em;color:#8795a0}

.sub{font:400 22px Arial;color:#9fb0bd;margin-top:10px}
.pair{position:absolute;left:50%;transform:translateX(-50%);top:214px;width:1200px;height:440px}
.win{position:absolute;width:600px;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px #2a3845;overflow:hidden}
.seq{left:0;top:64px;width:580px}
.roll{right:0;top:0;width:580px}

</style></head><body>
<div class="top"><div class="brand">REX AUDIO</div><h1>Chord Seq</h1><div class="sub">Sequence chords, key changes, tuning changes, voicings and arpeggios</div></div>
<div class="pair">
  <div class="win seq"><img src="_seq.png" style="width:100%;display:block"></div>
  <div class="win roll"><img src="_roll.png" style="width:100%;display:block"></div>
</div>
</body></html>
