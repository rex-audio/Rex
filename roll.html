  for (let k = 0; k < adds; k++) ns.push({ s: Math.floor(rng() * L), l: 1 + Math.floor(rng() * 2), m: shiftScale(pool[Math.floor(rng() * pool.length)].m, Math.floor((rng() - .5) * 5)), v: .75 });
  if (tr.kd.mono) { ns.sort((x, y) => x.s - y.s); for (let i = 0; i < ns.length - 1; i++) if (ns[i + 1].s < ns[i].s + ns[i].l) ns[i].l = Math.max(1, ns[i + 1].s - ns[i].s); }
  tr.notes = ns; reindex(tr);
}

// ---------- transport ----------
function schedule() {
  while (S.next < ctx.currentTime + .45) {
    const t = S.next, tick = S.tick;
    drumStep(tick, t);
    if (tick % 2 === 0) tracks.forEach(tr => { const l = tr.by.get((tick / 2) % tr.len); if (l) l.forEach(n => playNote(tr, n, t)); });
    S.tick++; S.next += TICK();
  }
}
async function play() {
  if (S.playing) return;
  await ctx.resume(); setName("Loading..."); await Promise.all(tracks.map(t => ensureLive(t.item.file)).concat(loadDrums())); setName(S.name);
  S.tick = 0; S.t0 = ctx.currentTime + .08; S.next = S.t0; S.playing = true; setPlaying(true);
  S.timer = setInterval(schedule, 25); schedule(); requestAnimationFrame(anim);
}
function stop() {
  S.playing = false; clearInterval(S.timer); setPlaying(false); fadeDrums(); tracks.forEach(t => fadeTrack(t, ctx.currentTime, .03)); ph.style.display = "none";
}
function fadeDrums() { drum.act.forEach(h => { h.g.gain.cancelScheduledValues(ctx.currentTime); h.g.gain.setTargetAtTime(0, ctx.currentTime, .03); try { h.s.stop(ctx.currentTime + .3); } catch (e) {} }); }
function setPlaying(on) { [$("#playBtn"), $("#playTop")].forEach(b => { b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Stop" : "Play"); }); }
[$("#playBtn"), $("#playTop")].forEach(b => { b.onclick = () => S.playing ? stop() : play(); });

// ---------- the track strips ----------
const strips = $("#tracks");
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const btn = (txt, cls, fn, title) => { const b = el("button", cls, txt); b.type = "button"; b.onclick = fn; if (title) { b.title = title; b.setAttribute("aria-label", title); } return b; };
const ARROW = d => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + (d < 0 ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7") + '" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const arrowBtn = (d, fn, title) => { const b = btn("", "arr", fn, title); b.innerHTML = ARROW(d); return b; };
function level(o, get, set) {
  const r = el("input", "lv"); r.type = "range"; r.min = 0; r.max = 1; r.step = .01; r.value = get(); r.setAttribute("aria-label", "Level"); r.oninput = () => { set(+r.value); updateMix(); }; o.appendChild(r);
}
function msBtns(o, tgt) {
  const m = btn("M", "ms" + (tgt.mute ? " on" : ""), () => { tgt.mute = !tgt.mute; m.classList.toggle("on", tgt.mute); updateMix(); }, "Mute");
  const s = btn("S", "ms" + (tgt.solo ? " on" : ""), () => { tgt.solo = !tgt.solo; s.classList.toggle("on", tgt.solo); updateMix(); }, "Solo"); o.append(m, s);
}
function renderTracks() {
  strips.innerHTML = "";
  const d = el("div", "strip drums"); d.append(el("i", "dot"), el("b", "kind", "Drums"));
  const dn = el("span", "nm", DR[drum.v].n); d.append(arrowBtn(-1, () => setDrum(drum.v - 1), "Previous drum loop"), dn, arrowBtn(1, () => setDrum(drum.v + 1), "Next drum loop"));
  const ctl = el("span", "ctl"); level(ctl, () => drum.level, v => { drum.level = v; }); msBtns(ctl, drum); d.append(ctl); d.style.setProperty("--c", "#2f86b8"); strips.appendChild(d);
  tracks.forEach(tr => {
    const s = el("div", "strip" + (tr === sel ? " sel" : "")); s.style.setProperty("--c", tr.kd.col);
    s.addEventListener("click", e => { if (e.target.closest("button,input")) return; sel = tr; renderTracks(); drawRoll(); });
    const inst = el("span", "nm", tr.item.n), pats = PAT[tr.kind], pn = el("span", "pn", pats[tr.pat].n);
    const row1 = el("div", "r1"), row2 = el("div", "r2");
    row1.append(el("i", "dot"), el("b", "kind", tr.kd.label), arrowBtn(-1, () => { setInst(tr, tr.inst - 1); inst.textContent = tr.item.n; sel = tr; drawRoll(); }, "Previous sound"), inst, arrowBtn(1, () => { setInst(tr, tr.inst + 1); inst.textContent = tr.item.n; sel = tr; drawRoll(); }, "Next sound"));
    row2.append(arrowBtn(-1, () => go(tr, -1), "Previous pattern"), pn, arrowBtn(1, () => go(tr, 1), "Next pattern"));
    const ctl = el("span", "ctl"); level(ctl, () => tr.level, v => { tr.level = v; }); msBtns(ctl, tr);
    ctl.append(btn("↻", "ms", () => { mutateTrack(tr, .5); sel = tr; drawRoll(); }, "A variation of this pattern"), btn("×", "ms", () => removeTrack(tr), "Remove this track")); row2.append(ctl);
    s.append(row1, row2); strips.appendChild(s);
  });
  $("#addTrack").disabled = tracks.length >= MAXT;
}
function go(tr, dd) { const pats = PAT[tr.kind]; loadPat(tr, (tr.pat + dd + pats.length) % pats.length); sel = tr; renderTracks(); drawRoll(); }
function setDrum(v) { drum.v = (v + DR.length) % DR.length; renderTracks(); loadDrums(); }
$("#addTrack").onclick = () => { addTrack($("#addKind").value); if (sel) audition(sel); };

// ---------- the piano roll ----------
const RN = 30, RH = 15, rkeys = $("#rollkeys"), rgrid = $("#rollgrid"), ph = $("#playhead");
function drawRoll() {
  const have = !!sel; $("#rollwrap").style.display = have ? "" : "none"; $("#rollempty").style.display = have ? "none" : "";
  $("#rollTitle").textContent = have ? sel.kd.label + " · " + sel.item.n : "Piano roll"; if (!have) return;
  $("#steps").value = sel.len; const hi = sel.lo + RN - 1;
  rkeys.innerHTML = ""; rgrid.querySelectorAll(".rr,.rn").forEach(e => e.remove());
  for (let m = hi; m >= sel.lo; m--) {
    const pc = m % 12, sc = inScale(m), k = el("div", "rk" + (BLACK.includes(pc) ? " bk" : "") + (sc ? " sc" : ""), pc === 0 || pc === KS.root ? NN[pc] + (Math.floor(m / 12) - 1) : ""); rkeys.appendChild(k);
    rgrid.insertBefore(el("div", "rr" + (BLACK.includes(pc) ? " bk" : "") + (sc ? " sc" : "") + (pc === 0 ? " c" : "")), ph);
  }
  rgrid.style.height = RN * RH + "px"; rgrid.style.setProperty("--n", sel.len); rgrid.style.setProperty("--b", sel.len / 4);
  sel.notes.forEach(n => {
    if (n.m < sel.lo || n.m > hi) return; const d = el("div", "rn");
    d.style.cssText = "left:" + n.s / sel.len * 100 + "%;width:" + n.l / sel.len * 100 + "%;top:" + (hi - n.m) * RH + "px;opacity:" + (.45 + n.v * .55) + ";background:" + sel.kd.col; rgrid.insertBefore(d, ph);
  });
}
let dragN = null;
rgrid.addEventListener("pointerdown", e => {
  if (!sel) return; e.preventDefault(); rgrid.setPointerCapture(e.pointerId);
  const z = +document.getElementById("site").style.zoom || 1, r = rgrid.getBoundingClientRect(), x = (e.clientX - r.left) / z, y = (e.clientY - r.top) / z, w = r.width / z;
  const s = clamp(Math.floor(x / w * sel.len), 0, sel.len - 1), m = sel.lo + RN - 1 - Math.floor(y / RH);
  const hit = sel.notes.findIndex(n => n.m === m && s >= n.s && s < n.s + n.l);
  if (hit >= 0) { sel.notes.splice(hit, 1); commit(); return; }
  const n = { s, l: Math.min(sel.lastLen || 1, sel.len - s), m, v: .8 }; sel.notes.push(n); dragN = { n, s }; commit(true);
});
rgrid.addEventListener("pointermove", e => {
  if (!dragN) return; const z = +document.getElementById("site").style.zoom || 1, r = rgrid.getBoundingClientRect(), s = Math.floor((e.clientX - r.left) / z / (r.width / z) * sel.len), l = Math.max(1, Math.min(sel.len - dragN.s, s - dragN.s + 1));
  if (l !== dragN.n.l) { dragN.n.l = l; drawRoll(); }
});
rgrid.addEventListener("pointerup", () => { if (!dragN) return; sel.lastLen = dragN.n.l; dragN = null; commit(); });
function commit(aud) { sel.base = clone(sel.notes); reindex(sel); drawRoll(); const n = sel.notes[sel.notes.length - 1]; if (aud && n) ensureLive(sel.item.file).then(() => { ctx.resume(); playNote(sel, { m: n.m, l: 2, v: .8 }, ctx.currentTime + .02); }); }
function anim() {
  if (!S.playing) return; const tk = (ctx.currentTime - S.t0) / TICK();
  if (sel && tk >= 0) { const stp = (tk / 2) % sel.len; ph.style.display = ""; ph.style.left = (Math.floor(stp) / sel.len * 100) + "%"; ph.style.width = 100 / sel.len + "%"; }
  requestAnimationFrame(anim);
}
$("#steps").onchange = e => { if (sel) { sel.len = +e.target.value; sel.notes = sel.notes.filter(n => n.s < sel.len); sel.base = clone(sel.notes); reindex(sel); drawRoll(); } };
$("#octUp").onclick = () => { if (sel) { sel.lo += 12; drawRoll(); } }; $("#octDown").onclick = () => { if (sel) { sel.lo -= 12; drawRoll(); } };
$("#clearRoll").onclick = () => { if (sel) { sel.notes = []; sel.base = []; reindex(sel); drawRoll(); } };
$("#diceRoll").onclick = () => { if (sel) { mutateTrack(sel, .5); drawRoll(); } };

// ---------- key, scale, tempo ----------
$("#key").innerHTML = NN.map((n, i) => '<option value="' + i + '">' + n + "</option>").join(""); $("#key").value = KS.root;
$("#scale").innerHTML = Object.keys(SCALES).map(n => "<option>" + n + "</option>").join(""); $("#scale").value = KS.scale;
function setKey(root, scale) {
  const oldRoot = KS.root, oldScale = KS.scale; KS.root = root; KS.scale = scale;
  let d = ((root - oldRoot) % 12 + 12) % 12; if (d > 6) d -= 12;
  tracks.forEach(tr => { [tr.notes, tr.base].forEach(ns => ns.forEach(n => { n.m += d; })); if (scale !== oldScale) { const L = scaleList(); [tr.notes, tr.base].forEach(ns => ns.forEach(n => { n.m = L[nearestIdx(L, n.m)]; })); } });
  drawRoll(); label();
}
$("#key").onchange = e => setKey(+e.target.value, KS.scale); $("#scale").onchange = e => setKey(KS.root, e.target.value);
const bpm = $("#bpm"); bpm.oninput = () => { S.bpm = +bpm.value; $("#bpmV").textContent = S.bpm; };
function label() { S.name = NN[KS.root] + " " + KS.scale.toLowerCase() + (S.n ? " · variation " + S.n : ""); if (!/^Loading/.test($("#barName").textContent)) setName(S.name); }

// ---------- the bar arrows: a new variation of everything, in the same key ----------
function variation(n) {
  S.n = n; const rng = mulberry(Math.imul(n + 7, 2654435761) ^ 0x9e3779b9), pick = k => Math.floor(rng() * k);
  drum.v = pick(DR.length);
  tracks.forEach(tr => { loadPat(tr, pick(PAT[tr.kind].length)); tr.inst = pick(LIVE[tr.kd.type].length); tr.item = LIVE[tr.kd.type][tr.inst]; mutateTrack(tr, .3, rng); });
  renderTracks(); drawRoll(); label(); loadDrums(); tracks.forEach(t => ensureLive(t.item.file));
}
$("#bp").onclick = () => variation(S.n - 1); $("#bn").onclick = () => variation(S.n + 1);
addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); S.playing ? stop() : play(); }
});
[$("#bar"), $(".topplay")].forEach(e => e.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b && ev.detail) b.blur(); }));
const fitSite = () => { const w = document.documentElement.clientWidth || window.innerWidth; $("#site").style.zoom = Math.min(Math.max(w / 720, 0.3), 1.5); };
fitSite(); addEventListener("resize", fitSite);

// ---------- the start: drums, a bass, an arp and chords in A minor ----------
drum.v = 0;
addTrack("bass", 7 % PAT.bass.length, 0); addTrack("arp", 0, 0); addTrack("stab", 0, 0); sel = tracks[1];
renderTracks(); drawRoll(); label(); loadDrums(); tracks.forEach(t => ensureLive(t.item.file));
</script>
</body>
