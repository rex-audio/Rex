/* the play bar: large and minimal, fills the bottom of the window and never moves */

          <div class="rig"><div id="dock"></div></div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span>&copy; 2026 Rex Audio</span>
  </footer>
</div>
<div id="bar"><div class="pill" role="group" aria-label="Player">
  <button id="bp" type="button" aria-label="Previous key" title="Previous key"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="go" id="playBtn" type="button" aria-pressed="false" aria-label="Play" title="Play / stop the harmonic series of the chosen key"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg><svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg></button>
  <button id="bn" type="button" aria-label="Next key" title="Next key"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <span class="name" id="barName" aria-live="polite"></span>
  <button id="bnew" type="button" aria-label="Random key" title="Random key"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="15" cy="9" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="9" cy="15" r="1.5" fill="currentColor"/><circle cx="15" cy="15" r="1.5" fill="currentColor"/></svg></button>
</div></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"], FLAT = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const keyNameOf = k => SHARP[k].length > 1 ? SHARP[k] + "/" + FLAT[k] : SHARP[k];
const LOW = 48, NKEYS = 24;   // the keyboard is two octaves from C3

// the three ways to play the series
//  series: every key is the next harmonic of the chosen key (the left key is the key itself, then its octave, then the fifth above that...)
//  notes:  press any note and it sounds with its own overtones, pure
//  fold:   an ordinary keyboard, each note moved to the nearest harmonic of the chosen key (17/16, 9/8, 19/16, 5/4, 21/16, 11/8, 3/2, 13/8, 27/16, 7/4, 15/8)
const MODES = [["series", "A harmonic on every key"], ["notes", "Each note with its overtones"], ["fold", "Keyboard tuned to the series"]];
const FOLD = [1, 17/16, 9/8, 19/16, 5/4, 21/16, 11/8, 3/2, 13/8, 27/16, 7/4, 15/8].map(r => 1200 * Math.log2(r));
const S = { key: 0, mode: 0, oct: 0, n: 8 };
const f0 = () => 440 * Math.pow(2, (36 + S.key + 12 * S.oct - 69) / 12);   // the key's own note, from C2 up
const mf = f => 69 + 12 * Math.log2(f / 440);
const noteOf = f => { const x = mf(f), n = Math.round(x); return { name: SHARP[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1), dev: Math.round((x - n) * 100) }; };
const devTxt = d => d === 0 ? "" : (d > 0 ? "+" : "−") + Math.abs(d);
const foldCents = m => { const d = ((m - S.key) % 12 + 12) % 12; return FOLD[d] - 100 * d; };   // how far the keyboard note moves
// the sounds a pressed key makes: [frequency, gain, harmonic number]
function notesFor(m) {
  const mode = MODES[S.mode][0];
  if (mode === "series") { const h = m - LOW + 1; if (h < 1 || h > 64) return []; return [[f0() * h, 1 / (1 + (h - 1) * .05), h]]; }
  if (mode === "notes") { const f = 440 * Math.pow(2, (m + 12 * S.oct - 69) / 12), out = []; for (let h = 1; h <= S.n; h++) out.push([f * h, 1 / Math.pow(h, 1.1), h]); return out; }
  return [[440 * Math.pow(2, (m + foldCents(m) / 100 + 12 * S.oct - 69) / 12), 1, 1]];
}
function keyLabel(m) {
  const mode = MODES[S.mode][0];
  if (mode === "series") { const h = m - LOW + 1, n = noteOf(f0() * h); return [String(h), n.name + devTxt(n.dev)]; }
  if (mode === "fold") return [SHARP[m % 12], devTxt(Math.round(foldCents(m)))];
  return [SHARP[m % 12], ""];
}

// ---------- key dropdown (a little keyboard) ----------
const dd = $("#dd"), ddl = $("#ddl"), ddb = $("#ddb"), ddKeys = [], WH = [0,2,4,5,7,9,11], BLK = [0,1,3,4,5];
function ddKey(k, cls, text) {
  const o = document.createElement("button"); o.type = "button"; o.className = "ddo " + cls; o.setAttribute("role", "option"); o.textContent = text;
  o.onclick = () => { setKey(k); closeDd(); ddb.focus(); };
  ddKeys[k] = o; return o;
}
WH.forEach(k => ddl.appendChild(ddKey(k, "w", SHARP[k])));
BLK.forEach(i => { const k = WH[i] + 1, o = ddKey(k, "b", SHARP[k]); o.style.left = `calc(${(i + 1) / 7 * 100}% - ${.3 / 7 * 100}%)`; o.style.width = `${.6 / 7 * 100}%`; o.title = SHARP[k] + " / " + FLAT[k]; ddl.appendChild(o); });
function openDd() { dd.classList.add("open"); ddb.setAttribute("aria-expanded", "true"); ddKeys[S.key].focus(); }
function closeDd() { dd.classList.remove("open"); ddb.setAttribute("aria-expanded", "false"); }
ddb.onclick = () => dd.classList.contains("open") ? closeDd() : openDd();
document.addEventListener("pointerdown", e => { if (!dd.contains(e.target)) closeDd(); });
ddl.addEventListener("keydown", e => {
  const i = ddKeys.indexOf(document.activeElement), mv = d => { e.preventDefault(); const n = i + d; if (n >= 0 && n < 12) ddKeys[n].focus(); };
  if (e.key === "Escape") { closeDd(); ddb.focus(); } else if (e.key === "ArrowRight" || e.key === "ArrowUp") mv(1); else if (e.key === "ArrowLeft" || e.key === "ArrowDown") mv(-1);
});

// ---------- controls ----------
const modeSel = $("#modeSel"), hSel = $("#hSel"), octSel = $("#octSel");
MODES.forEach(([, n], i) => { const o = document.createElement("option"); o.value = i; o.textContent = n; modeSel.appendChild(o); });
[4, 6, 8, 12, 16].forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n; hSel.appendChild(o); });
[-1, 0, 1].forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n === 0 ? "Normal" : n > 0 ? "Up 1" : "Down 1"; octSel.appendChild(o); });
const setKey = k => { S.key = (k % 12 + 12) % 12; stopAll(); refresh(); };
const setMode = i => { S.mode = (i % MODES.length + MODES.length) % MODES.length; stopAll(); refresh(); };
const setOct = n => { S.oct = clamp(n, -1, 1); stopAll(); refresh(); };
modeSel.onchange = () => { setMode(+modeSel.value); modeSel.blur(); };
hSel.onchange = () => { S.n = +hSel.value; stopAll(); refresh(); hSel.blur(); };
octSel.onchange = () => { setOct(+octSel.value); octSel.blur(); };
$("#kp").onclick = () => setKey(S.key + 11); $("#kn").onclick = () => setKey(S.key + 1);
$("#mp").onclick = () => setMode(S.mode - 1); $("#mn").onclick = () => setMode(S.mode + 1);
$("#op").onclick = () => setOct(S.oct - 1); $("#on").onclick = () => setOct(S.oct + 1);

// ---------- sound: pure tones with a soft attack, like an organ pipe ----------
let ctx = null, master = null;
function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.22;
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
}
function startVoice([f, g]) {
  const t = ctx.currentTime, o = ctx.createOscillator(), o2 = ctx.createOscillator(), a = ctx.createGain(), b = ctx.createGain(), vca = ctx.createGain();
  o.type = "sine"; o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f; a.gain.value = .85; b.gain.value = .12;
  vca.gain.setValueAtTime(0, t); vca.gain.linearRampToValueAtTime(g, t + .012); vca.gain.setTargetAtTime(g * .7, t + .012, .6);
  o.connect(a); o2.connect(b); a.connect(vca); b.connect(vca); vca.connect(master); o.start(t); o2.start(t);
  return { o, o2, vca };
}
function stopVoice(v) {
  const t = ctx.currentTime, g = v.vca.gain;
  if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else g.cancelScheduledValues(t);
  g.setTargetAtTime(0, t, .09); v.o.stop(t + .7); v.o2.stop(t + .7);
  v.o2.onended = () => { try { v.vca.disconnect(); } catch (e) {} };
}

// ---------- the virtual keyboard ----------
const dock = $("#dock");
(() => {
  const W = [0,2,4,5,7,9,11], BA = [0,1,3,4,5], count = 14;
  for (let i = 0; i < count; i++) { const k = document.createElement("div"); k.className = "dk"; k.dataset.m = LOW + 12 * Math.floor(i / 7) + W[i % 7]; dock.appendChild(k); }
  for (let i = 0; i < count; i++) { if (!BA.includes(i % 7)) continue; const k = document.createElement("div"); k.className = "bk"; k.dataset.m = LOW + 12 * Math.floor(i / 7) + W[i % 7] + 1; k.style.left = `calc(${(i + 1) / count * 100}% - ${.3 / count * 100}%)`; k.style.width = `${.6 / count * 100}%`; dock.appendChild(k); }
})();
function labelDock() {
  const series = MODES[S.mode][0] === "series";
  dock.querySelectorAll(".dk, .bk").forEach(k => {
    const m = +k.dataset.m, [a, b] = keyLabel(m); k.innerHTML = "<b>" + a + "</b><small>" + b + "</small>";
    const h = m - LOW + 1;
    k.classList.toggle("root", series ? (h & (h - 1)) === 0 : ((m - S.key) % 12 + 12) % 12 === 0);   // blue: the key itself and its octaves
  });
}
const held = new Map();
function lightKeys(ms, on) { ms.forEach(m => { const k = dock.querySelector(`[data-m="${m}"]`); if (k) k.classList.toggle("down", on); }); }
const readout = $("#readout");
const hz = (f, n) => "<small>" + f.toFixed(1) + " Hz · " + n.name + (n.dev ? " " + devTxt(n.dev) + "¢" : "") + "</small>";
function showRead(m) {
  const mode = MODES[S.mode][0], ns = notesFor(m); if (!ns.length) return;
  const [f, , h] = ns[0], n = noteOf(f);
  readout.innerHTML = mode === "notes" ? "Overtones 1–" + S.n + " of " + n.name + hz(f, n)
    : (mode === "series" ? "Harmonic " + h + " of " + keyNameOf(S.key) : SHARP[m % 12] + " tuned to the series of " + keyNameOf(S.key)) + hz(f, n);
}
function press(pid, ms) {
  ensureAudio(); release(pid);
  const voices = ms.flatMap(m => notesFor(m).map(startVoice)); held.set(pid, { ms, voices }); lightKeys(ms, true); showRead(ms[ms.length - 1]);
}
function release(pid) { const h = held.get(pid); if (!h) return; held.delete(pid); h.voices.forEach(stopVoice); lightKeys(h.ms, false); }
function stopAll() { stopPlay(); [...held.keys()].forEach(release); readout.innerHTML = "&nbsp;"; }
dock.addEventListener("pointerdown", e => { const k = e.target.closest(".dk, .bk"); if (!k) return; e.preventDefault(); press(e.pointerId, [+k.dataset.m]); });
const up = e => release(e.pointerId);
addEventListener("pointerup", up); addEventListener("pointercancel", up);
// computer keys: A W S E D F T G Y H U J K O L P ; ' play the first keys, Z / X move the octave
const KM = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15, ";":16, "'":17 };
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "z" || k === "x") { setOct(S.oct + (k === "x" ? 1 : -1)); return; }
  if (k in KM) press("k" + k, [LOW + KM[k]]);
});
addEventListener("keyup", e => release("k" + e.key.toLowerCase()));

// ---------- the player: the series of the chosen key, up and down ----------
const play = { on: false, t: 0, i: 0 }, playBtn = $("#playBtn");
function playTick() {
  if (!play.on) return;
  const N = 16, q = [...Array(N).keys()].map(i => i + 1).concat([...Array(N - 2).keys()].map(i => N - 1 - i)), h = q[play.i++ % q.length];
  ensureAudio(); release("play");
  const f = f0() * h, ms = h <= NKEYS ? [LOW + h - 1] : [];
  held.set("play", { ms, voices: [startVoice([f, 1 / (1 + (h - 1) * .05)])] }); lightKeys(ms, true);
  readout.innerHTML = "Harmonic " + h + " of " + keyNameOf(S.key) + hz(f, noteOf(f));
  play.t = setTimeout(playTick, 330);
}
function stopPlay() { play.on = false; clearTimeout(play.t); release("play"); playBtn.setAttribute("aria-pressed", false); playBtn.setAttribute("aria-label", "Play"); }
playBtn.onclick = () => { if (play.on) { stopPlay(); return; } ensureAudio(); play.on = true; play.i = 0; playBtn.setAttribute("aria-pressed", true); playBtn.setAttribute("aria-label", "Stop"); playTick(); };
$("#bp").onclick = () => setKey(S.key + 11); $("#bn").onclick = () => setKey(S.key + 1);
$("#bnew").onclick = () => { let k; do { k = Math.floor(Math.random() * 12); } while (k === S.key); setKey(k); };
$("#bar").addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

// ---------- refresh ----------
function refresh() {
  $("#ddv").textContent = keyNameOf(S.key); ddKeys.forEach((o, k) => o.setAttribute("aria-selected", k === S.key));
  modeSel.value = S.mode; hSel.value = S.n; octSel.value = S.oct; $("#hgrp").hidden = MODES[S.mode][0] !== "notes";
  $("#barName").textContent = keyNameOf(S.key) + " · " + MODES[S.mode][1];
  labelDock();
}

// ---------- MIDI keyboard (Web MIDI): its notes play; the mod wheel or CC 71 picks the key ----------
function onMidi(e) {
  const [st, d1, d2] = e.data, cmd = st & 0xf0;
  if (cmd === 0x90 && d2 > 0) press("m" + d1, [d1]);
  else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) release("m" + d1);
  else if (cmd === 0xB0 && (d1 === 1 || d1 === 71)) { const k = Math.min(11, d2 * 12 >> 7); if (k !== S.key) setKey(k); }
}
const midiBtn = $("#midiBtn"), midiMsg = $("#midiMsg"), midiDefault = midiMsg.textContent;
let midiAsked = false;
function midiStatus(names) {
  const on = names.length > 0; midiBtn.setAttribute("aria-pressed", on); midiBtn.lastChild.textContent = on ? names[0].slice(0, 22) : "Connect MIDI";
  midiMsg.textContent = on ? "MIDI keyboard connected: " + names[0] + ". Middle C is the first key of the keyboard below." : midiAsked ? "No MIDI keyboard found. Plug one in and it connects automatically." : midiDefault;
}
midiBtn.onclick = () => {
  if (!navigator.requestMIDIAccess) { midiMsg.textContent = "This browser has no Web MIDI. Chrome and Edge do. You can still play the keyboard below with the mouse, touch or computer keys."; return; }
  midiAsked = true;
  navigator.requestMIDIAccess().then(acc => {
    const hook = () => { const n = []; acc.inputs.forEach(i => { n.push(i.name); i.onmidimessage = onMidi; }); midiStatus(n); };
    acc.onstatechange = hook; hook();
  }).catch(() => { midiMsg.textContent = "MIDI access was blocked. Allow it in the browser to play with your keyboard."; });
};

// ---------- the page is a 720px canvas scaled to the window; the keyboard is scaled inside it ----------
const fit = () => { const w = $(".demo").clientWidth - 24; $("#app").style.zoom = Math.min(1, w / 760); };
const fitSite = () => { const w = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0); $("#site").style.zoom = Math.min(Math.max(w / 720, 0.3), 1.5); fit(); };
refresh(); fitSite(); addEventListener("resize", fitSite); addEventListener("load", fitSite);
</script>
<script src="nav.js"></script>
</body>
</html>
