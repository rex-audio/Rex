<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Loops | Rex Audio</title>
<style>
/* Same page frame as the other pages: a 720px "desktop" page scaled to the window. */
:root {
  --bg: #e4e7e9;
  --panel: #f3f4f5;
  --fg: #15181a;
  --muted: #5a6166;
  --line: #c3c9cc;
  --focus: #c8321e;
  --sans: Arial, Helvetica, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 17px; line-height: 1.6; overflow-x: hidden; padding-bottom: 100px; }
#site { width: 720px; margin: 0 auto; zoom: 0.54; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 36px 0; }
.brand { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none; }
.top nav { display: flex; gap: 22px; font-size: 15px; }
.top nav a { text-decoration: none; border-bottom: 1px solid transparent; }
.top nav a:hover, .top nav a[aria-current] { border-bottom-color: var(--fg); }

.intro { text-align: center; padding: 36px 36px 0; }
.intro h1 { font-size: 58px; line-height: 1; letter-spacing: -0.04em; margin-top: 10px; }
.sec { padding: 36px 36px 0; }
footer { margin-top: 72px; padding: 24px 36px 48px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--muted); }
footer nav { display: flex; gap: 18px; flex-wrap: wrap; } footer a { text-decoration: none; } footer a:hover { color: var(--fg); }

.topplay { display: flex; justify-content: center; margin-bottom: 26px; }
.go2 { width: 62px; height: 62px; padding: 0; border: 0; border-radius: 50%; background: var(--fg); color: var(--panel); cursor: pointer; display: grid; place-items: center; }
.go2:hover { background: #000; }
.go2:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.go2 svg { width: 30px; height: 30px; }
.go2 .i-stop, .go2[aria-pressed="true"] .i-play { display: none; } .go2[aria-pressed="true"] .i-stop { display: block; }

/* the stack of loops */
.loop { --lc: #2f86b8; position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--lc); border-radius: 12px; padding: 14px 18px 16px 16px; margin-bottom: 12px; transition: opacity .15s; }
.loop.pads { --lc: #7b6cd0; }
.loop.off { opacity: .5; }
.lrow { display: flex; align-items: center; gap: 12px; }
.lon { flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; display: grid; place-items: center; }
.lon i { width: 16px; height: 16px; border-radius: 50%; background: var(--lc); opacity: .25; }
.lon[aria-pressed="true"] i { opacity: 1; }
.lon:hover { border-color: var(--fg); }
.lt { flex: none; width: 58px; font-size: 16px; }
.lf { display: flex; flex-wrap: wrap; gap: 8px 14px; flex: 1; min-width: 0; }
.lf label { display: flex; align-items: center; gap: 6px; font: 700 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lf select { height: 36px; max-width: 150px; font: 600 14px var(--sans); color: var(--fg); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; cursor: pointer; }
.lf select:hover, .lx:hover { border-color: var(--fg); }
.lx { flex: none; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.lx:hover { color: var(--fg); }
.loop button:focus-visible, .loop select:focus-visible, .addrow button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ltr { margin-top: 12px; height: 8px; border-radius: 4px; background: rgba(21, 24, 26, .09); overflow: hidden; }
.lbar { height: 100%; background: var(--lc); transform-origin: left; transform: scaleX(0); }
.loop.wait .ltr { animation: pulse .9s ease-in-out infinite alternate; }
@keyframes pulse { from { background: rgba(21, 24, 26, .09); } to { background: color-mix(in srgb, var(--lc) 45%, transparent); } }
#empty { text-align: center; color: var(--muted); font-size: 15px; padding: 18px 0 22px; }
.addrow { display: flex; gap: 12px; margin-top: 4px; }
.addrow button { flex: 1; height: 52px; border: 2px dashed var(--line); border-radius: 12px; background: transparent; color: var(--fg); font: 700 15px var(--sans); cursor: pointer; }
.addrow button:hover:not(:disabled) { border-color: var(--fg); } .addrow button:disabled { opacity: .4; cursor: default; }

/* the play bar: large and minimal, fills the bottom of the window and never moves */
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; }
#bar .pill { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px max(16px, calc((100% - 680px) / 2)) calc(12px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--panel); box-shadow: 0 -6px 24px rgba(0, 0, 0, .18); }
#bar button { flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .14); color: inherit; cursor: pointer; display: grid; place-items: center; }
#bar button svg { width: 26px; height: 26px; }
#bar button:hover { background: rgba(255, 255, 255, .26); }
#bar button:focus-visible { outline: 2px solid var(--panel); outline-offset: 2px; }
#bar .go { width: 62px; height: 62px; background: var(--panel); color: var(--fg); }
#bar .go:hover { background: #fff; }
#bar .go svg { width: 30px; height: 30px; }
#bar .go .i-stop, #bar .go[aria-pressed="true"] .i-play { display: none; } #bar .go[aria-pressed="true"] .i-stop { display: block; }
#bar .name { flex: 1; min-width: 0; padding: 0 8px; text-align: center; font: 600 13px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

</style>

    // 'X' accent, 'x' hit, 'o' ghost note. Two-bar patterns are 32 steps. The classic breaks are approximate transcriptions: edit the steps or roll the dice.
    "Amen Break": { bpm: 165, swing: 0, len: 32, p: ["X.x.......x.....X.x.......xx....", "....X..o.o..X..o....X..o.o..X.oo", "", "x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.", "..............x.................", "", "", "X..............................."] },
    "Amen (B bars)": { bpm: 165, swing: 0, len: 32, p: ["X.x.......x.....X.x.....x.x.....", "....X..o.o..X..o....X.o.X..oX.XX", "", "x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.x.", "......x.......x.......x.......x.", "", "", ""] },
    "Think Break": { bpm: 160, swing: 0, len: 32, p: ["X.....x..x......X.....x...x.x...", "....X.o.o...X..o....X.o.o...X..o", "", "x.xxx.x.x.xxx.x.x.xxx.x.x.xxx.x.", "..............x.................", "", "", ""] },
    "Two-Step DnB": { bpm: 172, swing: 0, len: 16, p: ["X.........x.....", "....X.......X...", "", "x.x.x.x.x.x.x.x.", "......x.......x.", "", "", "X..............."] },
    "Jungle Roller": { bpm: 168, swing: 0, len: 32, p: ["X.x.....x.x.....X.x.....x.......", "....X..o.o..X...o...X..o.o..X.oo", "", "xoxoxoxoxoxoxoxoxoxoxoxoxoxoxoxo", "..............x.................", "..........x.....................", "", "X..............................."] },
    "Ragga Jungle": { bpm: 160, swing: 0, len: 16, p: ["X..x..x...x.....", "....X.....o.X.o.", "", "x.x.x.x.x.x.x.xo", "......x.........", "............o.x.", "", "X..............."] },
    "Neurofunk": { bpm: 174, swing: 0, len: 16, p: ["X.....x...x.....", "....X.......X...", "", "xoxoxoxoxoxoxoxo", "....o.......o...", "", "..o.......o.....", ""] },
    "Liquid DnB": { bpm: 172, swing: .08, len: 16, p: ["X.........x.x...", "....X.......X..o", "", "x.x.x.x.x.x.x.xo", "", "", "..o.....o.......", ""] },
    "Halftime DnB": { bpm: 172, swing: 0, len: 16, p: ["X.......x.x.....", "........X......o", "........x.......", "x.x.x.x.x.x.x.x.", "......x.......x.", "", "", ""] },
    "Breakcore": { bpm: 190, swing: 0, len: 16, p: ["X.x.X.x.X.x.X.x.", "..o.X.o.o.X.o.XX", "", "xxxxxxxxxxxxxxxx", "", "..x...x...x...x.", "", "X..............."] },
    "Fibonacci 3·5·8": { bpm: 112, swing: 0, p: [euc(3), euc(5, 16, 4), euc(5, 16, 7), euc(8), euc(2, 16, 6), euc(3, 16, 5), euc(5, 16, 9), euc(1, 16, 15)] },
    "Golden Spiral": { bpm: 100, swing: .06, p: [at(0, 1, 4, 7, 12), at(4, 12), at(12, 3), euc(8, 16, 1), at(6, 14), at(2, 8, 13), at(5, 10), at(15)] },
    "Pentagram 5": { bpm: 118, swing: 0, p: [euc(5), euc(5, 16, 2), euc(5, 16, 3), euc(10, 16, 1), euc(3, 16, 7), euc(5, 16, 1), euc(5, 16, 4), euc(1, 16, 10)] },
    "Hexagram 6": { bpm: 124, swing: .04, p: [euc(6), euc(6, 16, 3), euc(3, 16, 1), euc(12), euc(2, 16, 5), euc(4, 16, 2), euc(6, 16, 8), euc(1, 16, 13)] },
    "Seed 7": { bpm: 108, swing: .1, p: [euc(7), euc(4, 16, 3), euc(7, 16, 2), euc(11, 16, 1), euc(3, 16, 9), euc(7, 16, 5), euc(5, 16, 11), euc(2, 16, 14)] },
    "Vesica 2:3": { bpm: 96, swing: .12, p: [at(0, 6, 10), at(4, 12), at(12), euc(6, 16, 1), at(14), at(3, 7, 9), at(2, 11), at(8)] },
    "Yantra 9": { bpm: 128, swing: 0, p: [euc(9), euc(3, 16, 4), euc(3, 16, 5), euc(16), euc(4, 16, 2), euc(9, 16, 3), euc(3, 16, 11), euc(1, 16, 15)] },
    "Boom Bap": { bpm: 90, swing: .22, p: ["X.....x..xx.....", "....X.......X...", "....x.......x...", "x.x.x.x.x.x.x.x.", "..............x.", "", "", "......x........."] },
    "Four on the Floor": { bpm: 124, swing: 0, p: ["X...X...X...X...", "", "....X.......X...", "x.xxx.xxx.xxx.xx", "..x...x...x...x.", "", "", ""] },
    "Breakbeat": { bpm: 132, swing: .1, p: ["X.......x.x.....", "....X..x.x..X...", "", "x.x.x.x.x.x.x.x.", "......x.......x.", "", "", ""] },
    "Electro": { bpm: 120, swing: 0, p: ["X..x..x...X..x..", "....X.......X...", "....x.......x...", "x.x.x.x.x.x.x.x.", "", "", "..x.......x.....", "...x.....x.....x"] },
    "Trap": { bpm: 70, swing: 0, p: ["X.....x...X.....", "........X.......", "........x.......", "x.x.x.xxx.x.xxxx", "..............x.", "", "", ""] },
    "Funk": { bpm: 104, swing: .15, p: ["X..x..x...x.x...", "....X..x.x..X..x", "", "xxxxxxxxxxxxxxxx", "..x.......x.....", "", "", "...x......x....."] },
    "Techno": { bpm: 132, swing: 0, p: ["X...X...X...X...", "", "....x.......x...", "..x...x...x...x.", "x...x...x...x...", "", "...x.......x....", ""] },
    "Drum & Bass": { bpm: 172, swing: 0, p: ["X.........x.....", "....X.......X...", "", "x.x.x.x.x.x.x.x.", "", "", "", "..x.....x......."] },
    "Halftime": { bpm: 76, swing: .12, p: ["X.......X.x.....", "........X.......", "........x.......", "x.x.x.x.x.x.x.x.", "......x.......x.", "", "", "....x.......x..."] },
    "Dub": { bpm: 78, swing: .08, p: ["X.......X.......", "........X...x...", "", "..x...x...x...x.", "", "x...............", "......x.........", "x.....x......x.."] },
    "Empty": { bpm: 96, swing: 0, p: ["", "", "", "", "", "", "", ""] }
  };

const PNAMES = Object.keys(PATTERNS).filter(n => n !== "Empty");

// ---------- the stack: every loop plays in time with the others ----------
const BAR_S = 3.2, TPB = 32, TICK = BAR_S / TPB, MAXL = 6;   // 75 BPM: a bar is 3.2 s, the length of one pad chord
const LEVELS = [.95, .85, .75, .6, .6, .75, .55, .6], NV = 5;
const S = { playing: false, tick: 0, next: 0, t0: 0, timer: 0, name: "" };
let layers = [], uid = 0;
const KEEP = { drums: { pat: "Amen Break", kit: 0, speed: 2 }, pads: { pad: 0 } };
const nextBar = () => Math.ceil(S.tick / TPB) * TPB;   // a loop that starts while the stack plays waits for the next bar
const loopTicks = l => l.type === "pads" ? TPB * 4 : (PATTERNS[l.pat].len || 16) * (l.speed === 2 ? 1 : 2);

// ---------- the recordings ----------
const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
const SND = {}, PAD = {}, pending = new Map();
const loadBuf = url => {
  if (!pending.has(url)) pending.set(url, fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(a => new Promise((ok, no) => ctx.decodeAudioData(a, ok, no))).catch(() => null));
  return pending.get(url);
};
async function ensureSound(name) {
  if (SND[name]) return SND[name];
  const s = SOUNDS[name], m = new Map();
  if (s.v > 1) {
    const [b, ...vs] = await Promise.all([loadBuf("drums/" + s.file + "-b.flac")].concat([0, 1, 2, 3, 4].map(v => loadBuf("drums/" + s.file + "-" + v + ".flac"))));
    if (b) m.set(-1, b); vs.forEach((x, v) => { if (x) m.set(v, x); });
  } else { const b = await loadBuf("drums/" + s.file + "-0.flac"); if (b) m.set(-1, b); }
  return (SND[name] = m);
}
const ensurePad = async i => PAD[i] || (PAD[i] = await loadBuf("colours/" + PADS[i].file + ".mp3"));
let failed = false;
const setName = t => { $("#barName").textContent = t; };
async function loadFor(ls) {
  const jobs = []; ls.forEach(l => { if (l.type === "drums") KITS[l.kit].r.forEach(n => jobs.push(ensureSound(n))); else jobs.push(ensurePad(l.pad)); });
  if (!jobs.length) return; setName("Loading..."); await Promise.all(jobs);
  failed = ls.every(l => l.type === "drums" ? KITS[l.kit].r.every(n => !SND[n] || !SND[n].size) : !PAD[l.pad]);
  setName(failed ? "The recordings only play from the website" : S.name);
}

// ---------- audio ----------
const mnode = ctx.createGain(); mnode.gain.value = .7;
const sh = ctx.createWaveShaper(), cv = new Float32Array(4097);
for (let i = 0; i < cv.length; i++) { const x = 2 * i / 4096 - 1, a = Math.abs(x), T = .7; cv[i] = (x < 0 ? -1 : 1) * (a <= T ? a : T + (1 - T) * Math.tanh((a - T) / (1 - T))); }   // soft limiter
sh.curve = cv; sh.oversample = "2x"; mnode.connect(sh); sh.connect(ctx.destination);
const stepsOf = {};   // a pattern as numbers: 0 off, 1 hit, 2 accent, 3 ghost
const patSteps = n => stepsOf[n] || (stepsOf[n] = PATTERNS[n].p.map(s => Array.from({ length: PATTERNS[n].len || 16 }, (_, k) => s[k] === "X" ? 2 : s[k] === "x" ? 1 : s[k] === "o" ? 3 : 0)));
function wire(l) {   // each loop has its own output, and a drums loop its own row levels
  l.out = ctx.createGain(); l.out.gain.value = l.type === "drums" ? .9 : 1.4; l.out.connect(mnode); l.act = new Set();
  if (l.type === "drums") l.rows = LEVELS.map(v => { const g = ctx.createGain(); g.gain.value = v; g.connect(l.out); return g; });
}
function pickVi(sound, row, l, bar) {   // the sound moves between its recorded variants over 4 bars
  if (!SOUNDS[sound] || SOUNDS[sound].v < 2) return -1;
  const ph = ((bar / 4) + row * .19 + l.id * .07) % 1; return Math.round((1 - Math.abs(2 * ph - 1)) * (NV - 1));
}
function bufOf(sound, vi) {
  const m = SND[sound]; if (!m) return null; let b = m.get(vi);
  for (let d = 1; d < NV && !b; d++) b = m.get(vi + d) || m.get(vi - d);
  return b || m.get(-1) || null;
}
function drumHit(l, row, sound, t, vel, bar) {
  const b = bufOf(sound, pickVi(sound, row, l, bar)); if (!b) return;
  if (row === 3 || row === 4) l.act.forEach(h => { if (h.row === 3 || h.row === 4) { h.g.gain.cancelScheduledValues(t); h.g.gain.setTargetAtTime(0, t, .004); try { h.s.stop(t + .04); } catch (e) {} } });   // hats cut each other
  const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = b; g.gain.value = vel; s.connect(g); g.connect(l.rows[row]);
  const h = { s, g, row }; l.act.add(h); s.onended = () => l.act.delete(h); s.start(t);
}
function drumStep(l, tick, tib, t) {
  const pat = PATTERNS[l.pat], len = pat.len || 16, steps = patSteps(l.pat), sound = KITS[l.kit].r, bar = Math.floor(tick / TPB), rel = tick - l.start;
  let step;
  if (l.speed === 2) step = len === 16 ? rel % 16 : rel % 32;
  else { if (rel % 2) return; step = (rel / 2) % len; }
  const stepDur = TICK * (l.speed === 2 ? 1 : 2), tt = t + (step % 2 ? (pat.swing || 0) * stepDur * .66 : 0);
  steps.forEach((row, r) => { const v = row[step]; if (v) drumHit(l, r, sound[r], tt, v === 2 ? 1 : v === 3 ? .3 * (.85 + Math.random() * .3) : .62 * (.92 + Math.random() * .12), bar); });
}
function fade(l, t, tc = .15) { l.act.forEach(h => { h.g.gain.cancelScheduledValues(t); h.g.gain.setTargetAtTime(0, t, tc); try { h.s.stop(t + tc * 8); } catch (e) {} }); }
function padStart(l, t) {
  const b = PAD[l.pad]; if (!b) return;
  const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = b; s.connect(g); g.connect(l.out); const h = { s, g }; l.act.add(h); s.onended = () => l.act.delete(h); s.start(t);
}

// ---------- transport ----------
function schedule() {
  while (S.next < ctx.currentTime + .45) {
    const t = S.next, tick = S.tick, tib = tick % TPB;
    layers.forEach(l => {
      if (!l.on || tick < l.start) return;
      if (l.type === "drums") drumStep(l, tick, tib, t);
      else if ((tick - l.start) % (TPB * 4) === 0) padStart(l, t);   // a pad restarts every four bars
    });
    S.tick++; S.next += TICK;
  }
}
async function play() {
  if (S.playing) return;
  if (!layers.some(l => l.on)) { setName("Add a loop first"); setTimeout(() => setName(S.name), 1800); return; }
  await ctx.resume(); await loadFor(layers); if (failed) return;
  layers.forEach(l => { l.start = 0; });
  S.tick = 0; S.t0 = ctx.currentTime + .08; S.next = S.t0; S.playing = true; setPlaying(true);
  S.timer = setInterval(schedule, 25); schedule(); requestAnimationFrame(anim);
}
function stop() {
  S.playing = false; clearInterval(S.timer); setPlaying(false); layers.forEach(l => fade(l, ctx.currentTime, .03)); showProgress();
}
function setPlaying(on) { [$("#playBtn"), $("#playTop")].forEach(b => { b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Stop" : "Play"); }); }
[$("#playBtn"), $("#playTop")].forEach(b => { b.onclick = () => S.playing ? stop() : play(); });
const nowTick = () => (ctx.currentTime - S.t0) / TICK;
function showProgress() {   // each loop shows where it is in its own cycle; a loop that is waiting for the next bar pulses
  const tk = S.playing ? nowTick() : -1;
  layers.forEach(l => {
    const run = S.playing && l.on && tk >= l.start, wait = S.playing && l.on && tk < l.start;
    l.el.classList.toggle("wait", wait);
    l.bar.style.transform = "scaleX(" + (run ? ((tk - l.start) % loopTicks(l)) / loopTicks(l) : 0) + ")";
  });
}
function anim() { if (!S.playing) return; showProgress(); requestAnimationFrame(anim); }

// ---------- the stack on the page ----------
const stack = $("#stack");
const opt = (arr, f) => arr.map(f).join("");
function addLayer(type, init) {
  if (layers.length >= MAXL) return null;
  const l = Object.assign({ id: ++uid, type, on: true, start: S.playing ? nextBar() : 0 }, KEEP[type], init || {});
  wire(l); layers.push(l); build(l); refreshAdd(); return l;
}
function build(l) {
  const el = document.createElement("div"); el.className = "loop " + l.type; l.el = el;
  const dr = l.type === "drums";
  el.innerHTML = '<div class="lrow"><button class="lon" type="button" aria-pressed="true" title="On / off"><i></i></button><b class="lt">' + (dr ? "Drums" : "Pads") + '</b><span class="lf">' +
    (dr ? '<label>Pattern <select class="sPat">' + opt(PNAMES, n => `<option>${n}</option>`) + '</select></label><label>Kit <select class="sKit">' + opt(KITS, (k, i) => `<option value="${i}">${k.n}</option>`) + '</select></label><label>Tempo <select class="sSpd"><option value="2">150 BPM</option><option value="1">75 BPM</option></select></label>'
        : '<label>Pad <select class="sPad">' + opt(PADS, (p, i) => `<option value="${i}">${p.n}</option>`) + '</select></label>') +
    '</span><button class="lx" type="button" aria-label="Remove this loop" title="Remove">&times;</button></div><div class="ltr"><div class="lbar"></div></div>';
  l.bar = el.querySelector(".lbar");
  const on = el.querySelector(".lon"), set = () => { on.setAttribute("aria-pressed", l.on); el.classList.toggle("off", !l.on); };
  on.onclick = () => { l.on = !l.on; if (l.on) l.start = S.playing ? nextBar() : 0; else fade(l, ctx.currentTime, .05); set(); custom(); };
  const sel = (c, k, num) => { const s = el.querySelector(c); if (!s) return; s.value = l[k]; s.onchange = () => { l[k] = num ? +s.value : s.value; if (l.type === "pads") { fade(l, ctx.currentTime, .1); l.start = S.playing ? nextBar() : 0; } loadFor([l]); custom(); s.blur(); }; };
  sel(".sPat", "pat"); sel(".sKit", "kit", 1); sel(".sSpd", "speed", 1); sel(".sPad", "pad", 1);
  el.querySelector(".lx").onclick = () => { fade(l, ctx.currentTime, .05); layers = layers.filter(q => q !== l); el.remove(); refreshAdd(); custom(); };
  set(); stack.appendChild(el);
}
function refreshAdd() { $("#addDrums").disabled = $("#addPads").disabled = layers.length >= MAXL; $("#empty").hidden = layers.length > 0; }
function custom() { S.name = "Custom"; if (!failed) setName("Custom"); }
$("#addDrums").onclick = () => { const l = addLayer("drums"); if (l) { custom(); loadFor([l]); } };
$("#addPads").onclick = () => { const l = addLayer("pads"); if (l) { custom(); loadFor([l]); } };
addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); S.playing ? stop() : play(); }
});

// ---------- starting stacks: the arrows cycle through them ----------
const D = (pat, kit, speed = 2) => ["drums", { pat, kit: KITS.findIndex(k => k.n === kit), speed }], P = pad => ["pads", { pad: PADS.findIndex(p => p.n === pad) }];
const STACKS = [
  { n: "Break and pad", l: [D("Amen Break", "Jungle 909"), P("Warm chorus pad")] },
  { n: "Halftime haze", l: [D("Halftime DnB", "Sub & Tight"), P("Deep sea pad"), P("Violet haze")] },
  { n: "Boom bap and strings", l: [D("Boom Bap", "808", 1), P("Sunset strings")] },
  { n: "Neuro dark", l: [D("Neurofunk", "Industrial"), P("Obsidian")] },
  { n: "Four on the floor", l: [D("Four on the Floor", "909", 1), D("Funk", "Lo-Fi", 1), P("Forest air")] }
];
let si = 0;
function loadStack(i) {
  if (S.playing) stop();
  layers.forEach(l => { fade(l, ctx.currentTime, .03); l.el.remove(); }); layers = [];
  si = (i + STACKS.length) % STACKS.length; STACKS[si].l.forEach(([t, c]) => addLayer(t, c));
  S.name = STACKS[si].n; setName(S.name); refreshAdd(); showProgress();
}
$("#bp").onclick = () => loadStack(si - 1); $("#bn").onclick = () => loadStack(si + 1);
[$("#bar"), $(".topplay"), $(".addrow")].forEach(el => el.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); }));

const fitSite = () => { const w = document.documentElement.clientWidth || window.innerWidth; $("#site").style.zoom = Math.min(Math.max(w / 720, 0.3), 1.5); };
fitSite(); addEventListener("resize", fitSite);
loadStack(0);
</script>
</body>
