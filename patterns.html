<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Same page frame as the other pages: a 720px "desktop" page scaled to the window. The grid keeps the dark theme of the drum machine. */
:root {
  --bg: #e4e7e9;
  --panel: #f3f4f5;
  --fg: #15181a;
  --muted: #5a6166;
  --line: #c3c9cc;
  --focus: #c8321e;
  --sans: Arial, Helvetica, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 17px; line-height: 1.6; overflow-x: hidden; padding-bottom: 100px; }
#site { width: 720px; margin: 0 auto; zoom: 0.54; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 36px 0; }
.brand { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none; }
.top nav { display: flex; gap: 22px; font-size: 15px; }
.top nav a { text-decoration: none; border-bottom: 1px solid transparent; }
.top nav a:hover, .top nav a[aria-current] { border-bottom-color: var(--fg); }

.intro { text-align: center; padding: 36px 36px 0; }
.intro h1 { font-size: 58px; line-height: 1; letter-spacing: -0.04em; margin-top: 10px; }
.sec { padding: 36px 36px 0; }
footer { margin-top: 72px; padding: 24px 36px 48px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--muted); }
footer nav { display: flex; gap: 18px; flex-wrap: wrap; } footer a { text-decoration: none; } footer a:hover { color: var(--fg); }

/* the play bar: large and minimal, fills the bottom of the window and never moves */
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; }
#bar .pill { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px max(16px, calc((100% - 680px) / 2)) calc(12px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--panel); box-shadow: 0 -6px 24px rgba(0, 0, 0, .18); }
#bar button { flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .14); color: inherit; cursor: pointer; display: grid; place-items: center; }
#bar button svg { width: 26px; height: 26px; }
#bar button:hover { background: rgba(255, 255, 255, .26); }
#bar button:focus-visible { outline: 2px solid var(--panel); outline-offset: 2px; }
#bar .go { width: 62px; height: 62px; background: var(--panel); color: var(--fg); }
#bar .go:hover { background: #fff; }
#bar .go svg { width: 30px; height: 30px; }
#bar .go .i-stop, #bar .go[aria-pressed="true"] .i-play { display: none; } #bar .go[aria-pressed="true"] .i-stop { display: block; }
#bar .name { flex: 1; min-width: 0; padding: 0 8px; text-align: center; font: 600 13px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the grid: the drum machine's dark theme */
.demo {
  --bg:#070b0f; --win:#0d141b; --card:#121b24; --card2:#18232e; --line:#1f2e3b; --track:#243443;
  --text:#dbe9f5; --muted:#6f879b; --acc:#6fd3ff; --acc2:#b7f5e4; --a3:#a99bff;
  color-scheme: dark; color: var(--text); font-family: "Helvetica Neue", Inter, Arial, sans-serif; line-height: normal;
}
#sqapp { width: 900px; }
.sp { border: 1px solid var(--line); border-radius: 6px; background: var(--win); padding: 14px 16px 14px; }
.srow { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.srow .rl { width: 84px; flex: none; font: 700 12px Arial; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.srow .bars { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; flex: 1; min-width: 0; }
.srow.hd { margin: 0 0 2px; } .srow.hd .bn { text-align: center; font: 600 10px ui-monospace, Menlo, monospace; color: var(--muted); } .srow.hd .bn.g { color: var(--text); } .srow.hd .bn.now { color: var(--acc); }
.bc { position: relative; height: 46px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; touch-action: none; }
.bc.g { background: var(--card2); }
.bc.on { background: color-mix(in srgb, var(--rc) 78%, #0d141b); border-color: color-mix(in srgb, var(--rc) 78%, #0d141b); }
.bc.on.cont { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bc.on:not(.end) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.bc.cont { margin-left: -3px; }   /* a block's bars run into each other across the gap */
.bc.on.sel { background: var(--rc); border-color: var(--rc); filter: brightness(1.18); }   /* the chosen block is brighter */
.bc[data-label] { z-index: 2; }
.bc[data-label]::after { content: attr(data-label); position: absolute; left: 7px; top: 50%; transform: translateY(-50%); font: 700 11px Arial; color: #071016; white-space: nowrap; pointer-events: none; }
.bc.now { outline: 2px solid var(--text); outline-offset: -2px; z-index: 1; }
.strip { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; min-height: 54px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font: 700 11px Arial; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.strip[hidden], .strip [hidden] { display: none !important; }
.strip b { color: var(--text); font-size: 13px; letter-spacing: 0; text-transform: none; min-width: 110px; }
.strip label { display: flex; align-items: center; gap: 8px; }
.strip .grp { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.strip select { height: 28px; font: 600 12px Arial; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 4px; max-width: 170px; }
.strip button { height: 28px; min-width: 28px; padding: 0 10px; font: 700 12px Arial; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.strip button:hover:not(:disabled) { border-color: var(--muted); } .strip button:disabled { opacity: .35; cursor: default; }
.strip .len { display: flex; align-items: center; gap: 6px; } .strip .len span { min-width: 54px; text-align: center; color: var(--text); text-transform: none; font-size: 12px; }
.strip select:focus-visible, .strip button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.hint { font: 500 12px Arial; letter-spacing: 0; text-transform: none; }
</style>
</head>

}
let nowB = -1;
function paintNow(b) { cellEls.forEach(row => { if (nowB >= 0) row[nowB].classList.remove("now"); if (b >= 0) row[b].classList.add("now"); }); head.querySelectorAll(".bn").forEach((n, k) => n.classList.toggle("now", k === b)); nowB = b; }

// ---------- placing, selecting and editing blocks ----------
let drag = null;
const barAt = (e, lane) => { const r = cellEls[lane][0].parentNode.getBoundingClientRect(); return clamp(Math.floor((e.clientX - r.left) / r.width * NB), 0, NB - 1); };
grid.addEventListener("pointerdown", e => {
  const c = e.target.closest(".bc"); if (!c) return; const row = c.closest(".srow"), lane = rowEls.indexOf(row), b = +c.dataset.b; e.preventDefault();
  const blk = cells[lane][b];
  if (blk) { select(blk); return; }
  const left = b > 0 ? cells[lane][b - 1] : null, nb = left || newBlock(LANES[lane].type);   // starting right after a block extends it
  cells[lane][b] = nb; drag = { lane, blk: nb, last: b }; select(nb); changed();
});
grid.addEventListener("pointermove", e => {
  if (!drag) return; const b = barAt(e, drag.lane); if (b === drag.last) return;
  const step = b > drag.last ? 1 : -1;
  for (let k = drag.last + step; step > 0 ? k <= b : k >= b; k += step) { if (cells[drag.lane][k]) break; cells[drag.lane][k] = drag.blk; drag.last = k; }
  changed();
});
addEventListener("pointerup", () => { if (drag) { loadFor([drag.blk]); drag = null; } });
function changed() { S.name = "Custom"; if (!loadFailed) setName("Custom"); paint(); syncStrip(); }

const strip = $("#strip"), selPat = $("#bPat"), selKit = $("#bKit"), selSpd = $("#bSpd"), selPad = $("#bPad");
selPat.innerHTML = PNAMES.map(n => `<option>${n}</option>`).join(""); selKit.innerHTML = KITS.map((k, i) => `<option value="${i}">${k.n}</option>`).join(""); selPad.innerHTML = PADS.map((p, i) => `<option value="${i}">${p.n}</option>`).join("");
function select(blk) { S.sel = blk; paint(); syncStrip(); }
function syncStrip() {
  const blk = S.sel, lane = blk ? findLane(blk) : -1;
  if (!blk || lane < 0) { S.sel = null; $("#sHint").hidden = false; $("#sBody").hidden = true; return; }
  $("#sHint").hidden = true; $("#sBody").hidden = false;
  const sp = spanOf(lane, cells[lane].indexOf(blk)), n = sp.b - sp.a + 1;
  $("#sInfo").textContent = LANES[lane].label + " \u00B7 bar" + (n > 1 ? "s " + (sp.a + 1) + "\u2013" + (sp.b + 1) : " " + (sp.a + 1));
  $("#sLen").textContent = n + (n > 1 ? " bars" : " bar");
  const dr = blk.type === "drums"; $("#fDrums").hidden = !dr; $("#fPads").hidden = dr;
  if (dr) { selPat.value = blk.pat; selKit.value = blk.kit; selSpd.value = blk.speed; } else selPad.value = blk.pad;
  $("#bLess").disabled = n <= 1; $("#bMore").disabled = sp.b >= NB - 1 || !!cells[lane][sp.b + 1];
}
const edit = (k, v) => { const b = S.sel; if (!b) return; b[k] = v; KEEP[b.type][k] = v; S.name = "Custom"; setName("Custom"); loadFor([b]); };
selPat.onchange = () => { edit("pat", selPat.value); selPat.blur(); }; selKit.onchange = () => { edit("kit", +selKit.value); selKit.blur(); };
selSpd.onchange = () => { edit("speed", +selSpd.value); selSpd.blur(); }; selPad.onchange = () => { edit("pad", +selPad.value); selPad.blur(); };
$("#bMore").onclick = () => { const b = S.sel, lane = findLane(b), sp = spanOf(lane, cells[lane].indexOf(b)); if (sp.b < NB - 1 && !cells[lane][sp.b + 1]) { cells[lane][sp.b + 1] = b; changed(); } };
$("#bLess").onclick = () => { const b = S.sel, lane = findLane(b), sp = spanOf(lane, cells[lane].indexOf(b)); if (sp.b > sp.a) { cells[lane][sp.b] = null; changed(); } };
const removeSel = () => { const b = S.sel; if (!b) return; cells.forEach(r => r.forEach((c, i) => { if (c === b) r[i] = null; })); S.sel = null; changed(); };
$("#bDel").onclick = removeSel;
addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); S.playing ? stop() : play(); }
  else if ((e.key === "Delete" || e.key === "Backspace") && S.sel) { e.preventDefault(); removeSel(); }
});

// ---------- starting arrangements: the arrows cycle through them ----------
const D = (pat, kit, speed = 2) => ({ type: "drums", pat, kit: KITS.findIndex(k => k.n === kit), speed }), P = pad => ({ type: "pads", pad: PADS.findIndex(p => p.n === pad) });
const ARR = [
  { n: "Four bars and eight", b: [[0, 0, 4, D("Amen Break", "Jungle 909")], [2, 0, 8, P("Warm chorus pad")], [0, 8, 8, D("Two-Step DnB", "DnB Tight")], [2, 8, 8, P("Glass pad")]] },
  { n: "Slow build", b: [[2, 0, 8, P("Deep sea pad")], [0, 4, 12, D("Halftime DnB", "Sub & Tight")], [3, 8, 8, P("Violet haze")], [1, 12, 4, D("Breakbeat", "Hard 909")]] },
  { n: "Break and back", b: [[0, 0, 4, D("Boom Bap", "808", 1)], [2, 0, 4, P("Sunset strings")], [0, 4, 4, D("Jungle Roller", "Punchy")], [1, 4, 4, D("Think Break", "Electro")], [2, 4, 8, P("Northern lights")], [0, 8, 8, D("Neurofunk", "Industrial")], [2, 12, 4, P("Obsidian")]] },
  { n: "Pads and a pulse", b: [[2, 0, 16, P("Forest air")], [0, 0, 16, D("Four on the Floor", "909", 1)], [1, 8, 8, D("Funk", "Lo-Fi", 1)], [3, 4, 12, P("Moonlit meadow")]] }
];
let ai = 0;
function loadArr(i) {
  if (S.playing) stop();
  ai = (i + ARR.length) % ARR.length; cells.forEach(r => r.fill(null)); S.sel = null;
  ARR[ai].b.forEach(([lane, a, n, c]) => { const blk = Object.assign({}, c); for (let k = a; k < a + n; k++) cells[lane][k] = blk; });
  S.name = ARR[ai].n; setName(S.name); paint(); syncStrip();
}
$("#bp").onclick = () => loadArr(ai - 1); $("#bn").onclick = () => loadArr(ai + 1);
$("#bar").addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

// ---------- scale the panel to the page ----------
const fit = () => { $("#sqapp").style.zoom = Math.min(1, $(".demo").clientWidth / 900); };
const fitSite = () => { const w = document.documentElement.clientWidth || window.innerWidth; $("#site").style.zoom = Math.min(Math.max(w / 720, 0.3), 1.5); fit(); };
fitSite(); addEventListener("resize", fitSite);
loadArr(0);
</script>
</body>
