<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="A drum machine and break player. Every sound is a recording from the Rex Audio drum synth.">
<title>Drums | Rex Audio</title>
<style>
/* Same page frame as the home page: a 720px "desktop" page scaled to the window. The sequencer grid keeps the synth's own dark theme. */
:root {
  --bg: #e4e7e9;
  --panel: #f3f4f5;
  --fg: #15181a;
  --muted: #5a6166;
  --line: #c3c9cc;
  --focus: #c8321e;
  --sans: Arial, Helvetica, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 17px; line-height: 1.6; overflow-x: hidden; padding-bottom: 100px; }
#site { width: 720px; margin: 0 auto; zoom: 0.54; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 36px 0; }
.brand { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none; }
.top nav { display: flex; gap: 22px; font-size: 15px; }
.top nav a { text-decoration: none; border-bottom: 1px solid transparent; }
.top nav a:hover, .top nav a[aria-current] { border-bottom-color: var(--fg); }

.intro { text-align: center; padding: 36px 36px 0; }
.intro h1 { font-size: 58px; line-height: 1; letter-spacing: -0.04em; margin-top: 10px; }
.intro .lead { font-size: 19px; line-height: 1.5; margin: 16px auto 0; max-width: 560px; }
.sec { padding: 36px 36px 0; }
.notes { margin-top: 18px; font-size: 14px; line-height: 1.55; color: var(--muted); }
.notes b { color: var(--fg); }
.notes p + p { margin-top: 8px; }
footer { margin-top: 72px; padding: 24px 36px 48px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--muted); }
footer a { text-decoration: none; } footer a:hover { color: var(--fg); }

/* the controls: plain page styling */
.tun { display: grid; gap: 20px; }
.row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seg { display: flex; gap: 6px; align-items: center; }
.tun button, .tun select { height: 42px; font: 600 15px var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 0 14px; cursor: pointer; }
.tun select { background: var(--panel); padding: 0 8px; min-width: 0; }
.tun button:hover, .tun select:hover { border-color: var(--fg); }
.tun button:focus-visible, .tun select:focus-visible, .tun input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tun button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.tun .arrow { width: 42px; padding: 0; font-size: 18px; }
.tun .play { padding: 0 26px; background: var(--fg); color: var(--panel); border-color: var(--fg); }
.tun .play[aria-pressed="true"] { background: transparent; color: var(--fg); }
.tun input[type=range] { width: 130px; accent-color: var(--fg); }
.tun .val { min-width: 38px; font: 600 14px var(--sans); }
.tun .sl { display: flex; align-items: center; gap: 8px; height: 42px; }
#patSel { width: 130px; } #kitSel { width: 170px; } #styleSel { width: 150px; }

/* the play bar: large and minimal, fills the bottom of the window and never moves */
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; }
#bar .pill { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px max(16px, calc((100% - 680px) / 2)) calc(12px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--panel); box-shadow: 0 -6px 24px rgba(0, 0, 0, .18); }
#bar button { flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .14); color: inherit; cursor: pointer; display: grid; place-items: center; }
#bar button svg { width: 26px; height: 26px; }
#bar button:hover { background: rgba(255, 255, 255, .26); }
#bar button:focus-visible { outline: 2px solid var(--panel); outline-offset: 2px; }
#bar .go { width: 62px; height: 62px; background: var(--panel); color: var(--fg); }
#bar .go:hover { background: #fff; }
#bar .go svg { width: 30px; height: 30px; }
#bar .go .i-stop, #bar .go[aria-pressed="true"] .i-play { display: none; } #bar .go[aria-pressed="true"] .i-stop { display: block; }
#bar .name { flex: 1; min-width: 0; padding: 0 8px; text-align: center; font: 600 13px/1.3 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the grid: the synth's dark theme */
.demo {
  --bg:#070b0f; --win:#0d141b; --card:#121b24; --card2:#18232e; --line:#1f2e3b; --track:#243443;
  --text:#dbe9f5; --muted:#6f879b; --acc:#6fd3ff; --acc2:#b7f5e4; --a3:#a99bff;
  color-scheme: dark; margin-top: 26px; color: var(--text); font-family: "Helvetica Neue", Inter, Arial, sans-serif; line-height: normal;
}
#sqapp { width: 900px; }
.sp { border: 1px solid var(--line); border-radius: 6px; background: var(--win); padding: 14px 16px 12px; }
.srow { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.srow .rl { display: flex; align-items: center; gap: 5px; width: 236px; flex: none; }
.srow select { width: 132px; flex: none; height: 28px; font: 600 12px Arial; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.srow.sel .rl select { border-color: var(--rc); }
.rbtn { font: 700 10.5px Arial; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; cursor: pointer; }
.rbtn:hover { color: var(--text); }
.rbtn.on { background: var(--rc); border-color: var(--rc); color: var(--bg); }
.srow .steps { display: grid; grid-template-columns: repeat(var(--len, 16), 1fr); gap: 4px; flex: 1; min-width: 0; }
.stp { height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); cursor: pointer; touch-action: none; }
.stp.g { background: var(--card2); }
.stp.on { background: var(--rc); border-color: var(--rc); opacity: .72; }
.stp.on.acc { opacity: 1; box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
.stp.gh { opacity: .38 !important; }
.stp.sb { box-shadow: -3px 0 0 -1px var(--line); }
.stp.now { outline: 2px solid var(--text); outline-offset: -2px; }
.srow.muted .steps, .srow.muted .rl select { opacity: .4; }
.strip { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font: 700 11px Arial; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.strip b { color: var(--text); font-size: 13px; letter-spacing: 0; text-transform: none; min-width: 130px; }
.strip label { display: flex; align-items: center; gap: 8px; }
.strip input[type=range] { width: 110px; accent-color: var(--acc); }
.strip select { height: 26px; font: 600 12px Arial; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
.strip .v { min-width: 30px; font: 600 12px ui-monospace, Menlo, monospace; color: var(--text); text-transform: none; }
#seqstat { min-height: 16px; margin-top: 8px; font: 600 11px Arial; letter-spacing: .06em; color: var(--muted); }
</style>
</head>

<div id="site">
  <header class="top">
    <a class="brand" href="index.html">Rex Audio</a>
    <nav aria-label="Main">
      <a href="shapes.html">Shapes</a>
      <a href="drums.html" aria-current="page">Drums</a>

  <section class="intro">
    <p class="label">Drum machine</p>
    <h1>Drums</h1>
  </section>

  <section class="sec">
    <div class="tun">
      <div class="row">
        <div class="field"><span class="label">Pattern</span><div class="seg"><button class="arrow" id="pp" type="button" aria-label="Previous pattern">&lt;</button><select id="patSel" aria-label="Pattern"></select><button class="arrow" id="pnx" type="button" aria-label="Next pattern">&gt;</button></div></div>
        <div class="field"><span class="label">Kit</span><div class="seg"><button class="arrow" id="kp" type="button" aria-label="Previous kit">&lt;</button><select id="kitSel" aria-label="Kit"></select><button class="arrow" id="kn" type="button" aria-label="Next kit">&gt;</button><button id="kdice" type="button" title="Random kit">Random</button></div></div>
      </div>
      <div class="row">
        <div class="field"><span class="label">BPM</span><div class="sl"><input id="bpm" type="range" min="60" max="200" step="1" value="96" aria-label="BPM"><span class="val" id="bpmV">96</span></div></div>
        <div class="field"><span class="label">Swing</span><div class="sl"><input id="swing" type="range" min="0" max="0.6" step="0.01" value="0.2" aria-label="Swing"><span class="val" id="swingV">20%</span></div></div>
        <div class="field"><span class="label">Volume</span><div class="sl"><input id="master" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"><span class="val" id="masterV">0.70</span></div></div>
      </div>
      <div class="row">
        <div class="field"><span class="label">Variation</span><div class="sl"><input id="rand" type="range" min="0" max="1" step="0.01" value="0.3" aria-label="Variation amount"><span class="val" id="randV">30%</span><button id="diceBtn" type="button" title="Roll a variation of the loaded pattern">Roll</button><button id="resetBtn" type="button" title="Back to the loaded pattern">Reset</button></div></div>
        <div class="field"><span class="label">Evolve</span><select id="evolveSel" aria-label="Evolve"><option>Off</option><option>Every bar</option><option>2 bars</option><option>4 bars</option></select></div>
        <div class="field"><span class="label">Preset style</span><select id="styleSel" aria-label="Style of the presets the bar's arrows choose"><option value="dnb">DnB / Jungle</option><option value="geometry">Geometry</option><option value="colour">Colour</option><option value="classic">Classic</option><option value="all">Everything</option></select></div>
      </div>
    </div>

    <div class="demo">
      <div id="sqapp">
        <div class="sp">
          <div id="srows"></div>
          <div class="strip" id="rowstrip">
            <span>Row</span><b id="rowName"></b>
            <label>Level <input id="rowLevel" type="range" min="0" max="1" step="0.01" aria-label="Row level"><span class="v" id="rowLevelV"></span></label>
            <label>Pitch <input id="rowPitch" type="range" min="-12" max="12" step="1" aria-label="Row pitch in semitones"><span class="v" id="rowPitchV"></span></label>
            <label>Choke <select id="rowGroup" aria-label="Choke group: a hit cuts other rows in the same group"><option value="">&ndash;</option><option>A</option><option>B</option></select></label>
            <label>Motion <select id="rowMotion" aria-label="Motion"><option>Off</option><option>Sweep 2</option><option>Sweep 4</option><option>Sweep 8</option><option>Random</option><option>Alt</option></select></label>
          </div>
          <div id="seqstat" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <span>&copy; 2026 Rex Audio</span>
    <nav><a href="drums/COPYRIGHT.txt">Drum recordings: copyright notice</a></nav>
  </footer>
</div>

$("#bp").onclick = () => goBreak(S.brk - 1); $("#bn").onclick = () => goBreak(S.brk + 1);
$("#styleSel").onchange = e => { S.style = e.target.value; };
[patSel, kitSel, $("#styleSel"), $("#evolveSel")].forEach(s => s.addEventListener("change", () => s.blur()));

// after a mouse or touch click the bar button lets go of focus, so Space plays and stops (keyboard users keep focus)
$("#bar").addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

// ---------- scale the panel to the page ----------
const fit = () => { $("#sqapp").style.zoom = Math.min(1, $(".demo").clientWidth / 900); };
const fitSite = () => { const w = document.documentElement.clientWidth || window.innerWidth; $("#site").style.zoom = Math.min(Math.max(w / 720, 0.3), 1.5); fit(); };
loadPattern("Amen Break"); applyLen(); paintSel(); syncStrip(); fitSite(); addEventListener("resize", fitSite);
kitSel.value = 0; setKit(0, true);
